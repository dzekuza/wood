<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap&subset=latin,latin-ext">
  <style>
    body { margin: 0; }
    a { color: #FDB913; text-decoration: none; }
    a:hover { color: #ffd15c; }
    * { box-sizing: border-box; }
    .rail::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0D0D; font-family: Archivo, system-ui, sans-serif; color: #ffffff">

  <!-- PHOTO STAGE -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 460px; overflow: hidden">
    <img src="hero-texmex.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 46%; display: block">
    <div style="{{ washStyle }}"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.78) 0%, rgba(10,10,10,.10) 34%, rgba(13,13,13,.86) 82%, #0D0D0D 100%)"></div>
  </div>

  <!-- TOP BAR -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 5">
    <img src="talutti-wordmark.svg" alt="Talutti" style="height: 24px; width: auto; display: block">
    <button onClick="{{ noop }}" style="display: flex; flex-direction: column; gap: 5px; width: 28px; height: 44px; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer">
      <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
      <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
      <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
    </button>
  </div>

  <!-- HEADLINE over photo -->
  <div style="position: absolute; top: 268px; left: 20px; right: 20px; z-index: 4; display: flex; flex-direction: column; gap: 10px">
    <span style="{{ eyebrowStyle }}">{{ brand.eyebrow }}</span>
    <h1 style="margin: 0; font-family: Anton, 'Arial Narrow', sans-serif; font-size: 46px; line-height: .94; text-transform: uppercase">{{ brand.name }}</h1>
  </div>

  <!-- BRAND RAIL — scroll-snap, thumb-sized -->
  <div style="position: absolute; top: 386px; left: 0; right: 0; z-index: 4">
    <div class="rail" style="display: flex; gap: 10px; padding: 0 20px 14px 20px; overflow-x: auto; scrollbar-width: none">
      <button onClick="{{ tab0.pick }}" style="{{ tab0.style }}">
        <img src="brand-tastytrip.svg" alt="Tasty Trip" style="{{ tab0.logoStyle }}">
        <span style="{{ tab0.progressTrackStyle }}"><span style="{{ tab0.progressFillStyle }}"></span></span>
      </button>
      <button onClick="{{ tab1.pick }}" style="{{ tab1.style }}">
        <img src="brand-texmex.svg" alt="Tex-Mex" style="{{ tab1.logoStyle }}">
        <span style="{{ tab1.progressTrackStyle }}"><span style="{{ tab1.progressFillStyle }}"></span></span>
      </button>
      <button onClick="{{ tab2.pick }}" style="{{ tab2.style }}">
        <img src="brand-bakes.svg" alt="Bakes'n'Shakes" style="{{ tab2.logoStyle }}">
        <span style="{{ tab2.progressTrackStyle }}"><span style="{{ tab2.progressFillStyle }}"></span></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.46)">Trys virtuvės — pasirinkite</span>
      <button onClick="{{ togglePause }}" style="display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.20); background: rgba(255,255,255,.06); color: rgba(255,255,255,.80); cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase">
        {{ counter }} · {{ pauseLabel }}
      </button>
    </div>
  </div>

  <!-- VENUE + COPY -->
  <div style="position: absolute; top: 522px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.76); text-wrap: pretty">{{ brand.tagline }}</p>

    <button onClick="{{ openSheet }}" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 76px; padding: 14px 16px; border-radius: 12px; cursor: pointer; text-align: left; font-family: Archivo, system-ui, sans-serif; color: #ffffff; background: #171717; border: 1.5px solid rgba(255,255,255,.16)">
      <span style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FDB913" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-family: Anton, 'Arial Narrow', sans-serif; font-size: 17px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ venue.title }}</span>
          <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(255,255,255,.68)">
            <span style="{{ venue.dotStyle }}"></span>
            <span style="{{ venue.statusStyle }}">{{ venue.status }}</span>
            <span style="color: rgba(255,255,255,.30)">·</span>
            <span>{{ venue.hours }}</span>
            <span style="color: rgba(255,255,255,.30)">·</span>
            <span>{{ venue.dist }}</span>
          </span>
        </span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.56)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>

  <!-- STICKY ACTION BAR — thumb zone -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 26px 20px; background: linear-gradient(180deg, rgba(13,13,13,0) 0%, #0D0D0D 42%); display: flex; gap: 10px; z-index: 6">
    <button onClick="{{ noop }}" style="{{ ctaStyle }}">
      {{ brand.ctaShort }}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
    </button>
    <button onClick="{{ noop }}" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: #ffffff; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3Z"></path><path d="M9 4v13M15 7v13"></path></svg>
    </button>
  </div>

  <!-- BOTTOM SHEET -->
  <div style="{{ scrimStyle }}" onClick="{{ closeSheet }}"></div>
  <div style="{{ sheetStyle }}">
    <div style="display: flex; justify-content: center; padding: 10px 0 6px 0">
      <span style="display: block; width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.26)"></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 14px 20px">
      <span style="font-family: Anton, 'Arial Narrow', sans-serif; font-size: 20px; text-transform: uppercase">Pasirink restoraną</span>
      <button onClick="{{ closeSheet }}" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 20px 14px 20px">
      <sc-for list="{{ cities }}" as="city" hint-placeholder-count="2">
        <button onClick="{{ city.pick }}" style="{{ city.style }}">{{ city.label }}</button>
      </sc-for>
      <button onClick="{{ findNearest }}" style="margin-left: auto; display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 6px; background: none; border: 0; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #FDB913">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FDB913" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"></path></svg>
        Artimiausias
      </button>
    </div>
    <div style="max-height: 300px; overflow-y: auto; padding: 0 12px 20px 12px">
      <sc-for list="{{ venueRows }}" as="row" hint-placeholder-count="6">
        <button onClick="{{ row.pick }}" style="{{ row.style }}">
          <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; color: #ffffff">{{ row.name }}</span>
            <span style="font-size: 12px; color: rgba(255,255,255,.54)">{{ row.sub }} · {{ row.dist }}</span>
          </span>
          <span style="{{ row.pillStyle }}">{{ row.pill }}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true,"section":"Karuselė"},"showDistance":{"editor":"boolean","default":true,"section":"Restoranų parinkiklis"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { brand: 1, city: 'kaunas', venue: 'k1', sheetOpen: false, paused: false, progress: 24 };
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      if (!(this.props.autoplay ?? true) || this.state.paused || this.state.sheetOpen) return;
      const p = this.state.progress + 1.6;
      if (p >= 100) this.setState({ progress: 0, brand: (this.state.brand + 1) % 3 });
      else this.setState({ progress: p });
    }, 100);
  }

  componentWillUnmount() { clearInterval(this.timer); }

  go(i) { this.setState({ brand: (i + 3) % 3, progress: 0 }); }

  renderVals() {
    const s = this.state;

    const BRANDS = [
      { id: 'tastytrip', name: 'Tasty Trip', logo: 'brand-tastytrip.svg', color: '#F5A623',
        eyebrow: 'Picos · Kebabai · Salotos',
        tagline: 'Krosnyje keptos picos ir kebabai, gaminami tik tada, kai užsisakai — ne anksčiau.',
        ctaShort: 'Žiūrėti meniu', wash: 'rgba(245,166,35,.20)' },
      { id: 'texmex', name: 'Tex-Mex', logo: 'brand-texmex.svg', color: '#8DC63F',
        eyebrow: 'Tako · Burito · Margaritos',
        tagline: 'Tortilijos minkomos vietoje, salsa gaminama kiekvieną rytą, margaritos — nuo 16 val.',
        ctaShort: 'Žiūrėti meniu', wash: 'rgba(141,198,63,.16)' },
      { id: 'bakes', name: "Bakes'n'Shakes", logo: 'brand-bakes.svg', color: '#FDB913',
        eyebrow: 'Blynai · Vafliai · Kokteiliai',
        tagline: 'Storieji amerikietiški blynai, belgiški vafliai ir pieno kokteiliai visą dieną.',
        ctaShort: 'Žiūrėti meniu', wash: 'rgba(253,185,19,.16)' }
    ];

    const VENUES = [
      { id: 'k1', city: 'kaunas', name: 'Pramonės pr. 16A', sub: 'Dainava', hours: 'iki 22:00', open: true, dist: '2,4 km' },
      { id: 'k2', city: 'kaunas', name: 'Vasario 16-osios g. 2', sub: 'Centras', hours: 'iki 21:00', open: true, dist: '3,1 km' },
      { id: 'k3', city: 'kaunas', name: 'Laisvės al. 74', sub: 'Senamiestis', hours: 'iki 23:00', open: true, dist: '3,6 km' },
      { id: 'k4', city: 'kaunas', name: 'Taikos pr. 12', sub: 'Šilainiai', hours: 'nuo 10:00', open: false, dist: '5,2 km' },
      { id: 'k5', city: 'kaunas', name: 'PC Akropolis', sub: 'K. Mindaugo pr. 49', hours: 'iki 22:00', open: true, dist: '4,0 km' },
      { id: 'k6', city: 'kaunas', name: 'PC Mega', sub: 'Islandijos pl. 32', hours: 'iki 22:00', open: true, dist: '6,8 km' },
      { id: 'v1', city: 'vilnius', name: '[VILNIAUS ADRESAS 1]', sub: 'Vilnius', hours: 'iki 22:00', open: true, dist: '—' },
      { id: 'v2', city: 'vilnius', name: '[VILNIAUS ADRESAS 2]', sub: 'Vilnius', hours: 'iki 22:00', open: true, dist: '—' },
      { id: 'v3', city: 'vilnius', name: '[VILNIAUS ADRESAS 3]', sub: 'Vilnius', hours: 'nuo 10:00', open: false, dist: '—' }
    ];

    const showDist = this.props.showDistance ?? true;
    const b = BRANDS[s.brand];
    const v = VENUES.find((x) => x.id === s.venue) || VENUES[0];

    const rail = BRANDS.map((x, i) => {
      const on = i === s.brand;
      return {
        name: x.name,
        pick: () => this.go(i),
        style: 'position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 132px; height: 76px; padding: 12px 14px 16px 14px; border-radius: 12px; cursor: pointer; overflow: hidden; background: ' + (on ? 'rgba(255,255,255,.14)' : 'rgba(12,12,12,.58)') + '; border: 1.5px solid ' + (on ? x.color : 'rgba(255,255,255,.16)'),
        logoStyle: 'max-width: 100%; max-height: 36px; width: auto; display: block; opacity: ' + (on ? 1 : 0.5) + '; filter: ' + (on ? 'none' : 'grayscale(.65)'),
        progressTrackStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: ' + (on ? 'rgba(255,255,255,.16)' : 'transparent'),
        progressFillStyle: 'display: block; height: 100%; width: ' + (on ? s.progress : 0) + '%; background: ' + x.color
      };
      });

    return {
      brand: b,
      washStyle: 'position: absolute; inset: 0; background: ' + b.wash + '; transition: background 620ms ease',
      tab0: rail[0],
      tab1: rail[1],
      tab2: rail[2],
      cities: [
        { key: 'kaunas', label: 'Kaunas' },
        { key: 'vilnius', label: 'Vilnius' }
      ].map((c) => ({
        label: c.label,
        pick: () => this.setState({ city: c.key }),
        style: 'height: 44px; padding: 0 18px; border-radius: 8px; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid ' + (s.city === c.key ? '#FDB913' : 'rgba(255,255,255,.18)') + '; background: ' + (s.city === c.key ? 'rgba(253,185,19,.14)' : 'transparent') + '; color: ' + (s.city === c.key ? '#FDB913' : 'rgba(255,255,255,.72)')
      })),
      venueRows: VENUES.filter((x) => x.city === s.city).map((x) => ({
        name: x.name,
        sub: x.sub,
        dist: showDist ? x.dist : '',
        pill: x.open ? 'Atidaryta' : 'Uždaryta',
        pick: () => this.setState({ venue: x.id, sheetOpen: false }),
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 10px; cursor: pointer; text-align: left; border: 0; border-left: 3px solid ' + (s.venue === x.id ? '#FDB913' : 'transparent') + '; background: ' + (s.venue === x.id ? 'rgba(253,185,19,.10)' : 'transparent') + '; font-family: Archivo, system-ui, sans-serif',
        pillStyle: 'display: inline-flex; align-items: center; height: 24px; padding: 0 10px; flex-shrink: 0; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: ' + (x.open ? 'rgba(141,198,63,.18)' : 'rgba(255,255,255,.10)') + '; color: ' + (x.open ? '#A8DC5E' : 'rgba(255,255,255,.55)')
      })),
      eyebrowStyle: 'font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: ' + b.color,
      ctaStyle: 'display: flex; flex: 1; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 12px; border: 0; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: ' + b.color + '; color: #101010',
      venue: {
        title: v.name,
        status: v.open ? 'Atidaryta' : 'Uždaryta',
        hours: v.hours,
        dist: showDist ? v.dist : '',
        dotStyle: 'display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: ' + (v.open ? '#8DC63F' : 'rgba(255,255,255,.42)'),
        statusStyle: 'color: ' + (v.open ? '#A8DC5E' : 'rgba(255,255,255,.62)') + '; font-weight: 600'
      },
      counter: (s.brand + 1) + '/3',
      pauseLabel: s.paused ? 'Tęsti' : 'Stabdyti',
      togglePause: () => this.setState({ paused: !s.paused }),
      openSheet: () => this.setState({ sheetOpen: true }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      findNearest: () => this.setState({ city: 'kaunas', venue: 'k1', sheetOpen: false }),
      scrimStyle: 'position: absolute; inset: 0; z-index: 8; background: rgba(8,8,8,.56); display: ' + (s.sheetOpen ? 'block' : 'none'),
      sheetStyle: 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: #131313; border-top: 1px solid rgba(255,255,255,.14); border-radius: 18px 18px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,.6); transform: translateY(' + (s.sheetOpen ? '0' : '110%') + '); transition: transform 320ms cubic-bezier(.22,.8,.28,1)',
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
