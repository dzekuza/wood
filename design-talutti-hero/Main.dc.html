<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap&subset=latin,latin-ext">
  <style>
    body { margin: 0; }
    a { color: #FDB913; text-decoration: none; }
    a:hover { color: #ffd15c; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0D0D0D; font-family: Archivo, system-ui, sans-serif; color: #ffffff" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" onFocusCapture="{{ hoverOn }}" onBlurCapture="{{ hoverOff }}">

  <!-- PHOTO STAGE (the slide itself changes, not just a logo chip) -->
  <div style="position: absolute; inset: 0; overflow: hidden">
    <img src="hero-texmex.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 50%; display: block">
    <div style="{{ washStyle }}"></div>
  </div>
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,.94) 0%, rgba(10,10,10,.82) 34%, rgba(10,10,10,.18) 62%, rgba(10,10,10,.30) 100%)"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.72) 0%, rgba(10,10,10,0) 26%, rgba(10,10,10,0) 52%, rgba(10,10,10,.88) 100%)"></div>

  <!-- TOP BAR -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px">
    <img src="talutti-wordmark.svg" alt="Talutti" style="height: 30px; width: auto; display: block">
    <div style="display: flex; align-items: center; gap: 28px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.72)">LT / EN</span>
      <button onClick="{{ noop }}" style="display: flex; flex-direction: column; gap: 6px; width: 34px; background: none; border: 0; padding: 0; cursor: pointer">
        <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
        <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
        <span style="display: block; height: 3px; width: 100%; background: #ffffff; border-radius: 2px"></span>
      </button>
    </div>
  </div>

  <!-- LEFT COLUMN: one decision, one action -->
  <div style="position: absolute; left: 64px; top: 196px; width: 552px; display: flex; flex-direction: column; gap: 28px">

    <!-- VENUE SELECTOR — replaces the naked 6-address list -->
    <div style="position: relative; width: 100%">
      <button onClick="{{ togglePicker }}" style="{{ venueButtonStyle }}">
        <span style="display: flex; align-items: center; gap: 14px; min-width: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FDB913" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <span style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 0">
            <span style="font-family: Anton, 'Arial Narrow', sans-serif; font-size: 21px; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px">{{ venue.title }}</span>
            <span style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: rgba(255,255,255,.72)">
              <span style="{{ venue.dotStyle }}"></span>
              <span style="{{ venue.statusStyle }}">{{ venue.status }}</span>
              <span style="color: rgba(255,255,255,.34)">·</span>
              <span>{{ venue.hours }}</span>
              <span style="{{ venue.distSepStyle }}">·</span>
              <span style="{{ venue.distStyle }}">{{ venue.dist }}</span>
            </span>
          </span>
        </span>
        <span style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.62)">Keisti</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="{{ chevronStyle }}"><path d="m6 9 6 6 6-6"></path></svg>
        </span>
      </button>

      <!-- PICKER PANEL -->
      <div style="{{ pickerStyle }}">
        <div style="display: flex; gap: 8px; padding: 18px 18px 14px 18px; border-bottom: 1px solid rgba(255,255,255,.10)">
          <sc-for list="{{ cities }}" as="city" hint-placeholder-count="2">
            <button onClick="{{ city.pick }}" style="{{ city.style }}">{{ city.label }}</button>
          </sc-for>
          <button onClick="{{ findNearest }}" style="margin-left: auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 4px; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #FDB913">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDB913" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"></path></svg>
            Artimiausias
          </button>
        </div>
        <div style="max-height: 280px; overflow-y: auto; padding: 8px">
          <sc-for list="{{ venueRows }}" as="row" hint-placeholder-count="6">
            <button onClick="{{ row.pick }}" style="{{ row.style }}">
              <span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0">
                <span style="font-size: 15px; font-weight: 600; color: #ffffff">{{ row.name }}</span>
                <span style="font-size: 13px; color: rgba(255,255,255,.56)">{{ row.sub }}</span>
              </span>
              <span style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
                <span style="font-size: 13px; color: rgba(255,255,255,.48)">{{ row.dist }}</span>
                <span style="{{ row.pillStyle }}">{{ row.pill }}</span>
              </span>
            </button>
          </sc-for>
        </div>
        <div style="padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.10)">
          <a href="#" style="font-size: 13px; font-weight: 600">Visi restoranai žemėlapyje →</a>
        </div>
      </div>
    </div>

    <!-- BRAND HEADLINE -->
    <div style="display: flex; flex-direction: column; gap: 16px">
      <span style="{{ eyebrowStyle }}">{{ brand.eyebrow }}</span>
      <h1 style="margin: 0; font-family: Anton, 'Arial Narrow', sans-serif; font-size: 88px; line-height: .92; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance">{{ brand.name }}</h1>
      <p style="margin: 0; max-width: 440px; font-size: 18px; line-height: 1.5; color: rgba(255,255,255,.78); text-wrap: pretty">{{ brand.tagline }}</p>
    </div>

    <!-- ONE PRIMARY ACTION -->
    <div style="display: flex; align-items: center; gap: 14px">
      <button onClick="{{ noop }}" style="{{ ctaStyle }}">
        {{ brand.cta }}
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      </button>
      <button onClick="{{ noop }}" style="display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 26px; flex-shrink: 0; white-space: nowrap; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.34); background: rgba(255,255,255,.06); color: #ffffff; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3Z"></path><path d="M9 4v13M15 7v13"></path></svg>
        Kaip nuvykti
      </button>
    </div>
  </div>

  <!-- BRAND RAIL — the logos ARE the carousel control -->
  <div style="position: absolute; left: 64px; right: 64px; bottom: 52px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.50)">Trys virtuvės — vienas adresas</span>
      <div style="display: flex; align-items: stretch; gap: 12px">
        <button onClick="{{ prev }}" style="display: flex; align-items: center; justify-content: center; width: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #ffffff; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <button onClick="{{ tab0.pick }}" style="{{ tab0.style }}">
          <img src="brand-tastytrip.svg" alt="Tasty Trip" style="{{ tab0.logoStyle }}">
          <span style="{{ tab0.progressTrackStyle }}"><span style="{{ tab0.progressFillStyle }}"></span></span>
        </button>
        <button onClick="{{ tab1.pick }}" style="{{ tab1.style }}">
          <img src="brand-texmex.svg" alt="Tex-Mex" style="{{ tab1.logoStyle }}">
          <span style="{{ tab1.progressTrackStyle }}"><span style="{{ tab1.progressFillStyle }}"></span></span>
        </button>
        <button onClick="{{ tab2.pick }}" style="{{ tab2.style }}">
          <img src="brand-bakes.svg" alt="Bakes'n'Shakes" style="{{ tab2.logoStyle }}">
          <span style="{{ tab2.progressTrackStyle }}"><span style="{{ tab2.progressFillStyle }}"></span></span>
        </button>
        <button onClick="{{ next }}" style="display: flex; align-items: center; justify-content: center; width: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #ffffff; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 20px; padding-bottom: 4px">
      <span style="font-family: Anton, 'Arial Narrow', sans-serif; font-size: 15px; letter-spacing: .08em; color: rgba(255,255,255,.62)">{{ counter }}</span>
      <button onClick="{{ togglePause }}" style="display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: rgba(255,255,255,.86); cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase">
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ paused }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8Z"></path></svg>
        </sc-if>
        <sc-if value="{{ playing }}" hint-placeholder-val="{{ playing }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
        </sc-if>
        {{ pauseLabel }}
      </button>
    </div>
  </div>

  <!-- SCROLL CUE, demoted -->
  <div style="position: absolute; left: 64px; bottom: 18px; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.42)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
    Meniu
  </div>

  <!-- SCRIM while picker is open -->
  <div style="{{ scrimStyle }}" onClick="{{ closePicker }}"></div>
</div>
</x-dc>

<script data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true,"section":"Karuselė"},"showDistance":{"editor":"boolean","default":true,"section":"Restoranų parinkiklis"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { brand: 1, city: 'kaunas', venue: 'k1', pickerOpen: false, paused: false, hover: false, progress: 18 };
  }

  componentDidMount() {
    this.timer = setInterval(() => {
      const on = (this.props.autoplay ?? true) && !this.state.paused && !this.state.pickerOpen && !this.state.hover;
      if (!on) return;
      const p = this.state.progress + 1.6;
      if (p >= 100) this.setState({ progress: 0, brand: (this.state.brand + 1) % 3 });
      else this.setState({ progress: p });
    }, 100);
  }

  componentWillUnmount() { clearInterval(this.timer); }

  go(i) { this.setState({ brand: (i + 3) % 3, progress: 0 }); }

  renderVals() {
    const showDist = this.props.showDistance ?? true;
    const s = this.state;

    const BRANDS = [
      { id: 'tastytrip', name: 'Tasty Trip', logo: 'brand-tastytrip.svg', color: '#F5A623',
        eyebrow: 'Picos · Kebabai · Salotos',
        tagline: 'Krosnyje keptos picos ir kebabai, gaminami tik tada, kai užsisakai — ne anksčiau.',
        cta: 'Žiūrėti meniu', wash: 'rgba(245,166,35,.20)' },
      { id: 'texmex', name: 'Tex-Mex', logo: 'brand-texmex.svg', color: '#8DC63F',
        eyebrow: 'Tako · Burito · Margaritos',
        tagline: 'Tortilijos minkomos vietoje, salsa gaminama kiekvieną rytą, margaritos — nuo 16 val.',
        cta: 'Žiūrėti meniu', wash: 'rgba(141,198,63,.16)' },
      { id: 'bakes', name: "Bakes'n'Shakes", logo: 'brand-bakes.svg', color: '#FDB913',
        eyebrow: 'Blynai · Vafliai · Kokteiliai',
        tagline: 'Storieji amerikietiški blynai, belgiški vafliai ir pieno kokteiliai visą dieną.',
        cta: 'Žiūrėti meniu', wash: 'rgba(253,185,19,.16)' }
    ];

    const VENUES = [
      { id: 'k1', city: 'kaunas', name: 'Pramonės pr. 16A', sub: 'Kaunas · Dainava', hours: 'iki 22:00', open: true, dist: '2,4 km' },
      { id: 'k2', city: 'kaunas', name: 'Vasario 16-osios g. 2', sub: 'Kaunas · Centras', hours: 'iki 21:00', open: true, dist: '3,1 km' },
      { id: 'k3', city: 'kaunas', name: 'Laisvės al. 74', sub: 'Kaunas · Senamiestis', hours: 'iki 23:00', open: true, dist: '3,6 km' },
      { id: 'k4', city: 'kaunas', name: 'Taikos pr. 12', sub: 'Kaunas · Šilainiai', hours: 'nuo 10:00', open: false, dist: '5,2 km' },
      { id: 'k5', city: 'kaunas', name: 'PC Akropolis', sub: 'Karaliaus Mindaugo pr. 49', hours: 'iki 22:00', open: true, dist: '4,0 km' },
      { id: 'k6', city: 'kaunas', name: 'PC Mega', sub: 'Islandijos pl. 32', hours: 'iki 22:00', open: true, dist: '6,8 km' },
      { id: 'v1', city: 'vilnius', name: '[VILNIAUS ADRESAS 1]', sub: 'Vilnius', hours: 'iki 22:00', open: true, dist: '—' },
      { id: 'v2', city: 'vilnius', name: '[VILNIAUS ADRESAS 2]', sub: 'Vilnius', hours: 'iki 22:00', open: true, dist: '—' },
      { id: 'v3', city: 'vilnius', name: '[VILNIAUS ADRESAS 3]', sub: 'Vilnius', hours: 'nuo 10:00', open: false, dist: '—' }
    ];

    const b = BRANDS[s.brand];
    const v = VENUES.find((x) => x.id === s.venue) || VENUES[0];

    const washStyle = 'position: absolute; inset: 0; background: ' + b.wash + '; transition: background 620ms ease';

    const rail = BRANDS.map((x, i) => {
      const on = i === s.brand;
      return {
        name: x.name,
        pick: () => this.go(i),
        style: 'position: relative; display: flex; align-items: center; justify-content: center; width: 176px; height: 92px; padding: 16px 18px 20px 18px; border-radius: 12px; cursor: pointer; overflow: hidden; background: ' + (on ? 'rgba(255,255,255,.13)' : 'rgba(12,12,12,.52)') + '; border: 1.5px solid ' + (on ? x.color : 'rgba(255,255,255,.16)') + '; box-shadow: ' + (on ? '0 10px 30px rgba(0,0,0,.45)' : 'none') + '; transition: background 240ms ease, border-color 240ms ease',
        logoStyle: 'max-width: 100%; max-height: 44px; width: auto; height: auto; display: block; opacity: ' + (on ? 1 : 0.5) + '; filter: ' + (on ? 'none' : 'grayscale(.65)') + '; transition: opacity 240ms ease',
        progressTrackStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: ' + (on ? 'rgba(255,255,255,.16)' : 'transparent'),
        progressFillStyle: 'display: block; height: 100%; width: ' + (on ? s.progress : 0) + '%; background: ' + x.color
      };
    });

    const cities = [
      { key: 'kaunas', label: 'Kaunas (6)' },
      { key: 'vilnius', label: 'Vilnius (3)' }
    ].map((c) => ({
      label: c.label,
      pick: () => this.setState({ city: c.key }),
      style: 'height: 38px; padding: 0 18px; border-radius: 8px; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid ' + (s.city === c.key ? '#FDB913' : 'rgba(255,255,255,.18)') + '; background: ' + (s.city === c.key ? 'rgba(253,185,19,.14)' : 'transparent') + '; color: ' + (s.city === c.key ? '#FDB913' : 'rgba(255,255,255,.72)')
    }));

    const venueRows = VENUES.filter((x) => x.city === s.city).map((x) => ({
      name: x.name,
      sub: x.sub,
      dist: showDist ? x.dist : '',
      pill: x.open ? 'Atidaryta' : 'Uždaryta',
      pick: () => this.setState({ venue: x.id, pickerOpen: false }),
      style: 'display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 60px; padding: 12px 14px; border-radius: 10px; cursor: pointer; text-align: left; border: 0; border-left: 3px solid ' + (s.venue === x.id ? '#FDB913' : 'transparent') + '; background: ' + (s.venue === x.id ? 'rgba(253,185,19,.10)' : 'transparent') + '; font-family: Archivo, system-ui, sans-serif',
      pillStyle: 'display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: ' + (x.open ? 'rgba(141,198,63,.18)' : 'rgba(255,255,255,.10)') + '; color: ' + (x.open ? '#A8DC5E' : 'rgba(255,255,255,.55)')
    }));

    return {
      washStyle: washStyle,
      tab0: rail[0],
      tab1: rail[1],
      tab2: rail[2],
      cities: cities,
      venueRows: venueRows,
      brand: b,
      eyebrowStyle: 'font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: ' + b.color,
      ctaStyle: 'display: flex; flex-shrink: 0; white-space: nowrap; align-items: center; gap: 12px; height: 58px; padding: 0 30px; border-radius: 10px; border: 0; cursor: pointer; font-family: Archivo, system-ui, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: ' + b.color + '; color: #101010; box-shadow: 0 10px 30px rgba(0,0,0,.42)',
      venue: {
        title: v.name,
        status: v.open ? 'Atidaryta' : 'Uždaryta',
        hours: v.hours,
        dist: showDist ? v.dist : '',
        dotStyle: 'display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: ' + (v.open ? '#8DC63F' : 'rgba(255,255,255,.42)'),
        statusStyle: 'color: ' + (v.open ? '#A8DC5E' : 'rgba(255,255,255,.62)') + '; font-weight: 600',
        distStyle: showDist ? 'color: rgba(255,255,255,.72)' : 'display: none',
        distSepStyle: showDist ? 'color: rgba(255,255,255,.34)' : 'display: none'
      },
      venueButtonStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 100%; height: 84px; padding: 0 22px; border-radius: 12px; cursor: pointer; text-align: left; font-family: Archivo, system-ui, sans-serif; color: #ffffff; background: rgba(16,16,16,.78); border: 1.5px solid ' + (s.pickerOpen ? '#FDB913' : 'rgba(255,255,255,.20)'),
      chevronStyle: 'transform: rotate(' + (s.pickerOpen ? 180 : 0) + 'deg); transition: transform 220ms ease',
      pickerStyle: 'position: absolute; z-index: 30; top: 94px; left: 0; width: 100%; border-radius: 14px; background: #131313; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.62); overflow: hidden; display: ' + (s.pickerOpen ? 'block' : 'none'),
      scrimStyle: 'position: absolute; inset: 0; z-index: 20; background: rgba(8,8,8,.42); display: ' + (s.pickerOpen ? 'block' : 'none'),
      counter: (s.brand + 1) + ' / 3',
      paused: s.paused,
      playing: !s.paused,
      pauseLabel: s.paused ? 'Tęsti' : 'Stabdyti',
      togglePause: () => this.setState({ paused: !s.paused }),
      togglePicker: () => this.setState({ pickerOpen: !s.pickerOpen }),
      closePicker: () => this.setState({ pickerOpen: false }),
      findNearest: () => this.setState({ city: 'kaunas', venue: 'k1', pickerOpen: false }),
      prev: () => this.go(s.brand - 1),
      next: () => this.go(s.brand + 1),
      hoverOn: () => this.setState({ hover: true }),
      hoverOff: () => this.setState({ hover: false }),
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
